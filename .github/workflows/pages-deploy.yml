name: Web app checks (hosted on Render)

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/service-worker.js
      - name: Validate web manifest
        run: python3 -m json.tool web/manifest.webmanifest >/dev/null
      - name: Verify required web assets
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/manifest.webmanifest
